name: near_transfer_flutter
description: "A powerful cross-platform file transfer and sharing application."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.2
  go_router: ^14.6.2
  file_picker: ^8.3.7
  permission_handler: ^11.3.0
  path_provider: ^2.1.5
  animate_do: ^3.3.4
  glassmorphism: ^3.0.0
  sqflite: ^2.4.1
  path: ^1.9.1
  flutter_webrtc: ^0.12.4
  flutter_local_notifications: ^18.0.1
  http: ^1.2.2
  open_file: ^3.5.9
  uuid: ^4.5.1
  share_plus: ^7.0.2
  clipboard: ^0.1.3
  flutter_contacts: ^1.1.9
  sensors_plus: ^6.0.1
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.0
  wakelock_plus: ^1.2.5
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2
  # call_log and flutter_sms_inbox removed - required sensitive permissions
  photo_manager: ^3.0.0
  google_mobile_ads: ^5.2.0
  in_app_purchase: ^3.2.0
  sqflite_common_ffi: ^2.3.6
  installed_apps: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#00B4DB"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/app_icon.png"

flutter_native_splash:
  color: "#1A237E"
  image: "assets/app_icon.png"
  android: true
  ios: true
  android_12:
    color: "#1A237E"
    image: "assets/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/app_icon.png
